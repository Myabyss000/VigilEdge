<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Verify 2FA - VigilEdge WAF</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 30%, #16213e 60%, #0f3460 100%);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(100, 200, 255, 0.2);
            --card-bg: rgba(30, 30, 50, 0.85);
            --cyber-blue: #00d4ff;
            --cyber-teal: #00ffa6;
            --danger: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #e1e7f5;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verify-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            border: 1px solid var(--glass-border);
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .code-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            text-align: center;
            color: white;
            letter-spacing: 0.5rem;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .code-input:focus {
            outline: none;
            border-color: var(--cyber-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .btn-cyber {
            background: linear-gradient(135deg, var(--cyber-blue), var(--cyber-teal));
            color: #0f172a;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-cyber:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="verify-container">
        <div class="icon-circle">🔐</div>
        <h1>Authentication Required</h1>
        <p>Please enter the verification code from your authenticator app.</p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/verify-2fa" method="POST">
            {% if secret %}
            <input type="hidden" name="secret" value="{{ secret }}">
            {% endif %}

            <input type="text" name="code" class="code-input" placeholder="000000" maxlength="6" required
                autocomplete="off" autofocus>

            <button type="submit" class="btn-cyber">Verify</button>
        </form>

        <a href="/login" class="back-link">← Back to Login</a>
    </div>
</body>

</html>
