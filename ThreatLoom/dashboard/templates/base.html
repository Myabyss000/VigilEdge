<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ThreatLoom SOC{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        soc: {
                            dark: '#0a0e17',
                            panel: '#111827',
                            border: '#1f2937',
                            accent: '#3b82f6',
                            danger: '#ef4444',
                            warn: '#f59e0b',
                            success: '#22c55e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-soc-dark text-gray-200 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-soc-panel border-b border-soc-border px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-6">
            <h1 class="text-xl font-bold text-white">
                <span class="text-soc-accent">&#9670;</span> ThreatLoom
                <span class="text-xs text-gray-500 ml-2">SOC Platform</span>
            </h1>
            <div class="flex gap-4 ml-8">
                <a href="/" class="text-sm hover:text-white transition {% block nav_dashboard %}{% endblock %}">Dashboard</a>
                <a href="/alerts-view" class="text-sm hover:text-white transition {% block nav_alerts %}{% endblock %}">Alerts</a>
                <a href="/incidents-view" class="text-sm hover:text-white transition {% block nav_incidents %}{% endblock %}">Incidents</a>
                <a href="/logs-view" class="text-sm hover:text-white transition {% block nav_logs %}{% endblock %}">Logs</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-xs text-gray-400">
                <button id="notification-bell" type="button" class="relative rounded border border-gray-700 px-2 py-1 hover:text-white transition" title="Notifications">
                    Alerts
                    <span id="notification-count" class="absolute -top-2 -right-2 min-w-5 h-5 px-1 rounded-full bg-red-600 text-white text-[10px] leading-5 text-center hidden">0</span>
                </button>
            </div>
            <div id="live-indicator" class="flex items-center gap-2">
                <span id="live-dot" class="w-2 h-2 bg-gray-500 rounded-full"></span>
                <span id="live-label" class="text-xs text-gray-400">CONNECTING</span>
            </div>
            <span class="text-xs text-gray-500" id="clock"></span>
        </div>
    </nav>

    <!-- Content -->
    <main class="p-6">
        {% block content %}{% endblock %}
    </main>

    <div id="notification-toasts" class="fixed top-20 right-4 z-50 flex w-[24rem] max-w-[calc(100vw-2rem)] flex-col gap-2"></div>

    <script>
        // Live clock
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toISOString().slice(0, 19) + 'Z';
        }
        setInterval(updateClock, 1000);
        updateClock();

        (() => {
            const storageKey = 'threatloom.savedTimeFilter';
            const clearParam = 'clear_saved_time';
            const currentUrl = new URL(window.location.href);

            function readSavedWindow() {
                try {
                    const raw = localStorage.getItem(storageKey);
                    return raw ? JSON.parse(raw) : null;
                } catch {
                    return null;
                }
            }

            function writeSavedWindow(start, end) {
                localStorage.setItem(storageKey, JSON.stringify({ start, end }));
            }

            function clearSavedWindow() {
                localStorage.removeItem(storageKey);
            }

            if (currentUrl.searchParams.get(clearParam) === '1') {
                clearSavedWindow();
                currentUrl.searchParams.delete(clearParam);
                window.location.replace(currentUrl.pathname + (currentUrl.search ? `?${currentUrl.searchParams.toString()}` : ''));
                return;
            }

            const timeFilterForms = Array.from(document.querySelectorAll('[data-time-filter-form]'));
            if (!timeFilterForms.length) {
                return;
            }

            const hasExplicitWindow = currentUrl.searchParams.has('start') || currentUrl.searchParams.has('end');
            const savedWindow = readSavedWindow();

            if (!hasExplicitWindow && savedWindow?.start && savedWindow?.end) {
                currentUrl.searchParams.set('start', savedWindow.start);
                currentUrl.searchParams.set('end', savedWindow.end);
                window.location.replace(currentUrl.pathname + `?${currentUrl.searchParams.toString()}`);
                return;
            }

            timeFilterForms.forEach((form) => {
                const startInput = form.querySelector('input[name="start"]');
                const endInput = form.querySelector('input[name="end"]');
                const saveButton = form.querySelector('[data-save-time-filter]');
                const clearButton = form.querySelector('[data-clear-time-filter]');

                if (!startInput || !endInput) {
                    return;
                }

                saveButton?.addEventListener('click', () => {
                    if (!startInput.value || !endInput.value) {
                        return;
                    }
                    writeSavedWindow(startInput.value, endInput.value);
                    saveButton.textContent = 'Saved';
                    setTimeout(() => {
                        saveButton.textContent = 'Save Window';
                    }, 1500);
                });

                clearButton?.addEventListener('click', () => {
                    clearSavedWindow();
                });
            });
        })();

        (() => {
            const bell = document.getElementById('notification-bell');
            const countBadge = document.getElementById('notification-count');
            const toastHost = document.getElementById('notification-toasts');
            const liveDot = document.getElementById('live-dot');
            const liveLabel = document.getElementById('live-label');
            let unreadCount = 0;
            let reconnectTimer = null;
            const RECONNECT_DELAY = 5000;

            function setLive(state) {
                if (state === 'live') {
                    liveDot.className = 'w-2 h-2 bg-green-500 rounded-full animate-pulse';
                    liveLabel.textContent = 'LIVE';
                } else if (state === 'offline') {
                    liveDot.className = 'w-2 h-2 bg-red-500 rounded-full';
                    liveLabel.textContent = 'OFFLINE';
                } else {
                    liveDot.className = 'w-2 h-2 bg-gray-500 rounded-full';
                    liveLabel.textContent = 'CONNECTING';
                }
            }

            function setUnreadCount(value) {
                unreadCount = Math.max(0, value);
                countBadge.textContent = unreadCount;
                countBadge.classList.toggle('hidden', unreadCount === 0);
            }

            function showToast(title, message, tone) {
                const toast = document.createElement('div');
                const toneClass = tone === 'CRITICAL' ? 'border-red-500' : tone === 'HIGH' ? 'border-orange-500' : 'border-blue-500';
                toast.className = `rounded-lg border ${toneClass} bg-soc-panel px-4 py-3 shadow-lg`;
                toast.innerHTML = `<div class="text-sm font-semibold text-white">${title}</div><div class="mt-1 text-xs text-gray-300">${message}</div>`;
                toastHost.prepend(toast);
                setTimeout(() => toast.remove(), 6000);
            }

            bell.addEventListener('click', async () => {
                setUnreadCount(0);
                if ('Notification' in window && Notification.permission === 'default') {
                    try { await Notification.requestPermission(); } catch {}
                }
            });

            function connectNotificationsWS() {
                const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
                const notifToken = localStorage.getItem('token');

                // No token → don't bother connecting (server will 4001-reject it).
                // Poll localStorage every 5 s in case the user logs in.
                if (!notifToken) {
                    console.warn('[ThreatLoom] No auth token — WS skipped, retrying in 5 s');
                    setLive('offline');
                    reconnectTimer = setTimeout(connectNotificationsWS, RECONNECT_DELAY);
                    return;
                }

                setLive('connecting');
                console.log('[ThreatLoom] WS connecting…');
                const ws = new WebSocket(
                    `${protocol}://${location.host}/ws/notifications?token=${encodeURIComponent(notifToken)}`
                );

                let pingInterval = null;

                ws.onopen = () => {
                    console.log('[ThreatLoom] WS open — LIVE');
                    setLive('live');
                    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                    // Application-level keepalive every 15 s
                    pingInterval = setInterval(() => {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'ping' }));
                        }
                    }, 15000);
                };

                ws.onerror = (event) => {
                    console.error('[ThreatLoom] WS error:', event);
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type !== 'notification') return;
                        const data = msg.data || {};
                        const title = data.notification_title || (data.kind === 'playbook' ? `Playbook: ${data.playbook || 'Notification'}` : (data.title || 'New Alert'));
                        const body = data.message || (data.kind === 'playbook'
                            ? 'Playbook action triggered'
                            : `${data.severity || 'INFO'} • ${data.src_ip || 'unknown'} • ${data.attack_type || 'activity'}${data.event_count ? ` • ${data.event_count} events` : ''}`);
                        setUnreadCount(unreadCount + 1);
                        showToast(title, body, data.severity || 'LOW');
                        if ('Notification' in window && Notification.permission === 'granted') {
                            new Notification(title, { body });
                        }
                    } catch {}
                };

                ws.onclose = (event) => {
                    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
                    setLive('offline');
                    console.warn('[ThreatLoom] WS closed, code=' + event.code + ' reason=' + event.reason);
                    // Code 4001 = auth failure — token missing or expired
                    if (event.code === 4001) {
                        showToast('Session Expired', 'Please sign in again to restore live notifications.', 'HIGH');
                        localStorage.removeItem('token');
                        setTimeout(() => { window.location.href = '/login'; }, 3000);
                        return;
                    }
                    reconnectTimer = setTimeout(connectNotificationsWS, RECONNECT_DELAY);
                };
            }

            connectNotificationsWS();
        })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
