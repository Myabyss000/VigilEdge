<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatLoom - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">
                <span class="text-blue-500">&#9670;</span> ThreatLoom
            </h1>
            <p class="text-gray-500 text-sm mt-2">Password Recovery</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-lg p-8">
            <h2 class="text-lg font-semibold text-white mb-6">Reset Password</h2>

            <div id="error-msg" class="hidden bg-red-900/50 border border-red-800 text-red-300 text-sm rounded px-4 py-2 mb-4"></div>
            <div id="success-msg" class="hidden bg-green-900/50 border border-green-800 text-green-300 text-sm rounded px-4 py-2 mb-4"></div>

            <form id="resetForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-2 text-white focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Recovery Key (from .env)</label>
                    <div class="relative">
                        <input type="password" id="recovery_key" name="recovery_key" required
                            class="w-full bg-gray-800 border border-gray-700 rounded px-4 pr-10 py-2 text-white focus:border-blue-500 focus:outline-none">
                        <button type="button" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white" onclick="togglePassword('recovery_key')">
                            <svg id="eye-icon-recovery_key" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">New Password</label>
                    <div class="relative">
                        <input type="password" id="new_password" name="new_password" required minlength="12"
                            class="w-full bg-gray-800 border border-gray-700 rounded px-4 pr-10 py-2 text-white focus:border-blue-500 focus:outline-none">
                        <button type="button" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white" onclick="togglePassword('new_password')">
                            <svg id="eye-icon-new_password" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="12"
                            class="w-full bg-gray-800 border border-gray-700 rounded px-4 pr-10 py-2 text-white focus:border-blue-500 focus:outline-none">
                        <button type="button" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white" onclick="togglePassword('confirm_password')">
                            <svg id="eye-icon-confirm_password" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">
                    Reset Password
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/login" class="text-sm text-gray-400 hover:text-white transition">&larr; Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            const submitBtn = document.getElementById('submitBtn');
            
            errEl.classList.add('hidden');
            successEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            const new_pass = document.getElementById('new_password').value;
            const confirm_pass = document.getElementById('confirm_password').value;

            if (new_pass !== confirm_pass) {
                errEl.textContent = 'Passwords do not match';
                errEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
                return;
            }

            try {
                const resp = await fetch('/api/v1/users/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        recovery_key: document.getElementById('recovery_key').value,
                        new_password: new_pass,
                        confirm_password: confirm_pass
                    })
                });

                if (!resp.ok) {
                    const data = await resp.json();
                    throw new Error(data.detail || 'Password reset failed');
                }

                successEl.textContent = 'Password reset successful! You can now log in.';
                successEl.classList.remove('hidden');
                document.getElementById('resetForm').reset();
                
                setTimeout(() => {
                    window.location.href = '/login';
                }, 3000);

            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('eye-icon-' + inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />';
            }
        }
    </script>
</body>
</html>
