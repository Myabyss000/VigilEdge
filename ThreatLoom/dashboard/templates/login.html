<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreatLoom - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">
                <span class="text-blue-500">&#9670;</span> ThreatLoom
            </h1>
            <p class="text-gray-500 text-sm mt-2">Security Operations Center</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-lg p-8">
            <h2 class="text-lg font-semibold text-white mb-6">Sign In</h2>

            <div id="error-msg" class="hidden bg-red-900/50 border border-red-800 text-red-300 text-sm rounded px-4 py-2 mb-4"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-2 text-white focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full bg-gray-800 border border-gray-700 rounded px-4 py-2 text-white focus:border-blue-500 focus:outline-none">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition">
                    Sign In
                </button>
            </form>

            <p class="text-xs text-gray-600 mt-6 text-center">
                Default: admin / changeme
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error-msg');
            errEl.classList.add('hidden');

            try {
                const resp = await fetch('/api/v1/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    })
                });

                if (!resp.ok) {
                    const data = await resp.json();
                    throw new Error(data.detail || 'Login failed');
                }

                const data = await resp.json();
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
